<div class="row">
	@if(track) {
		<div class="col-sm-6 col-12">
			<!-- populate with track name-->
			<h1>{{track.name}}</h1>
			<p>
				<!-- link to album page, display album name-->
				Track on <a [href]="'/album/' + track.album.id">{{track.album.name}}</a>
			</p>
			<div>
				<!-- loop over track's artists-->
				@for(artist of track.artists; track $index) {
					<p>
					<!-- link to artist page, display artist name-->
						Artist: <a [href]="'/artist/' + artist.id">{{artist.name}}</a>
					</p>
				}
			</div>
			<p>
				<!-- populate with track duration-->
				Duration: {{track.durationStr}}
			</p>
			<p>
				<!-- link to track page on spotify, display track name-->
				<a class="btn btn-light" role="button" target="_blank" [href]="track.url">Open {{track.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-sm-6 col-12">
			<!-- create a thermometer component with the track's popularity-->
			<app-thermometer [popularity]="track.popularity"></app-thermometer>
		</div>
	}
</div>
