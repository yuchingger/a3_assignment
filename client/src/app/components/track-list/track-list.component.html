@if(tracks) {
	<table class="table table-sm table-light table-striped">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Track</th>
				<th scope="col">Duration</th>
				<!-- Use @if to hide if hideArtist is true-->
				@if(!hideArtist) {
					<th scope="col">Primary Artist</th>
				}
				<!-- Use @if to hide if hideAlbum is true-->
				@if(!hideAlbum) {
					<th scope="col">Album</th>
				}
			</tr>
		</thead>
		<tbody>
			<!-- Use @for to loop over tracks-->
			@for(track of tracks; track $index; let i = $index) {
			<tr>
				<!-- Populate with row index (start with 1!)-->
				<td>{{i + 1}}</td>
				<td>
					<!-- link to the endpoint for that track, display the track's name-->
					<a [href]="'/track/' + track.id">{{track.name}}</a>
				</td>
				<!-- display the track's duration-->
				<td>{{track.durationStr}}</td>
				<!-- Use @if to hide if hideArtist is true; link to the first artist's endpoint and display the first artist's name-->
				@if(!hideArtist) {
					<td><a [href]="'/artist/' + track.artists[0].id">{{track.artists[0].name}}</a></td>
				}
				<!-- Use @if to hide if hideAlbum is true; link to the album's endpoint and display the album's name-->
				@if(!hideAlbum) {
					<td><a [href]="'/album/' + track.album.id">{{track.album.name}}</a></td>
				}
			</tr>
		}
		</tbody>
	</table>
}
