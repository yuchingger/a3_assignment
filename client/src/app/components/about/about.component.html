<!--Define click callback to load about me information-->
<button class="btn btn-light" (click)="loadAboutMe()">Load info about me</button>
<div *ngIf="name">
	<h3>Logged in user: {{name}}</h3>
	<img [src]="profile_pic" class="profile">
	<p>
		<a class="btn btn-light" [href]="profile_link" target="_blank">Open profile on Spotify</a>
	</p>
</div>
